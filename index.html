/* 붙여넣기 사고를 미리 잡아낸다.
   모바일에서 흔한 실패: 기존 값을 지우지 않아 두 토큰이 이어붙거나, 손으로 긁어서 일부만 복사됨.
   classic 토큰은 'ghp_' + 36자 = 정확히 40자다. */
function checkTokenFormat(t){
  if(!t) return { level:'', msg:'' };
  if(/\s/.test(t))                return { level:'bad',  msg:'토큰 안에 공백이나 줄바꿈이 섞여 있어요. 다시 복사해 주세요.' };
  if(t.startsWith('github_pat_')) return { level:'bad',  msg:'이건 fine-grained 토큰이에요. gist를 지원하지 않으니 classic 토큰(ghp_)으로 새로 만들어 주세요.' };
  if(!/^gh[po]_/.test(t))         return { level:'bad',  msg:'ghp_ 로 시작해야 하는데 "' + t.slice(0,4) + '…" 로 시작해요. 토큰이 아닌 다른 값을 붙여넣은 것 같아요.' };
  if(t.length > 40)               return { level:'bad',  msg:'길이가 ' + t.length + '자예요 (정상 40자). 기존 토큰을 지우지 않고 덧붙여진 것 같아요 — [지우기] 후 다시 붙여넣어 주세요.' };
  if(t.length < 40)               return { level:'warn', msg:'길이가 ' + t.length + '자예요 (정상 40자). 일부만 복사됐을 수 있어요.' };
  return { level:'ok', msg:'형식 정상 (' + t.length + '자)' };
}
function renderTokenCheck(){
  const el = document.getElementById('token-check');
  const c = checkTokenFormat(document.getElementById('set-ghtoken').value.trim());
  const mark = c.level === 'ok' ? '🟢 ' : (c.level === 'warn' ? '🟡 ' : '🔴 ');
  el.innerHTML = c.msg ? mark + esc(c.msg) : '';
}
function clearToken(){
  document.getElementById('set-ghtoken').value = '';
  renderTokenCheck();
  document.getElementById('set-ghtoken').focus();
}
// 설정 화면의 연결 테스트 (입력 중인 토큰으로 검사)
// 목록 조회만으로는 부족하다 — 실제로 Gist를 만들었다 지워 보며 쓰기 권한까지 확인한다
async function testSyncToken(){
  const token = document.getElementById('set-ghtoken').value.trim();
  if(!token){ toast('GitHub 토큰을 먼저 입력하세요'); return; }
  const c = checkTokenFormat(token);
  if(c.level === 'bad'){ toast('❌ ' + c.msg); return; }  // 형식이 확실히 틀리면 통신 전에 알려준다
  if(!navigator.onLine){ toast('❌ 오프라인이에요. 인터넷 연결을 확인해 주세요'); return; }
  toast('연결 확인 중…');
  try{
    const login = await ghLogin(token);
    const g = await ghApi('/gists', { method:'POST', body: JSON.stringify({
      description: '링크보관함 연결 테스트 (자동 삭제됨)', public: false,
      files: { 'link-archivist-test.txt': { content: 'ok' } }
    })}, token);
    try{ await ghApi('/gists/' + g.id, { method:'DELETE' }, token); }catch(e){}
    toast('✅ ' + login + ' 계정 연결 성공!');
  }catch(err){ toast('❌ ' + err.message); }
}
// 설정 화면 상단의 동기화 상태 표시
function renderSyncStatus(){
  const el = document.getElementById('sync-status');
  if(!el) return;
  if(!settings.ghToken){ el.innerHTML = '⚪ 동기화 꺼짐 — 토큰을 넣으면 켜집니다'; return; }
  const last = settings.lastSync ? new Date(settings.lastSync).toLocaleString('ko-KR') : '아직 없음';
  // 저장된 토큰의 앞부분과 길이만 보여준다 (값 자체는 노출하지 않음 — 기기 간 비교용)
  const t = settings.ghToken;
  const fp = t.slice(0, 4) + '…(' + t.length + '자)';
  el.innerHTML = (settings.syncError
      ? '🔴 <b>동기화 안 됨</b> — ' + esc(settings.syncError)
      : '🟢 정상 작동 중' + (settings.ghLogin ? ' (' + esc(settings.ghLogin) + ')' : ''))
    + '<br>마지막 동기화: ' + esc(last) + ' · 이 기기의 링크 ' + items.length + '개 · 메모 ' + memos.filter(m=>!m.deleted).length + '개'
    + '<br>저장된 토큰: ' + esc(fp);
}

/* ============================================================
   초기화 + PWA 서비스워커 등록
   ============================================================ */
/* ============================================================
   서비스워커 관리 + 진단
   오래된 서비스워커가 남아 있으면 GitHub 통신이 막히는 문제가 있었다.
   그래서 버전을 확인해 다르면 한 번만 자동으로 완전 새로고침한다.
   ============================================================ */
const SW_EXPECTED = 'linkarchive-v19';

// 실행 중인 서비스워커의 버전을 물어본다
async function swVersion(){
  const ctrl = navigator.serviceWorker && navigator.serviceWorker.controller;
  if(!ctrl) return null;
  return new Promise(res => {
    const ch = new MessageChannel();
    ch.port1.onmessage = ev => res((ev.data && ev.data.version) || '(응답 없음)');
    try{ ctrl.postMessage('version', [ch.port2]); }catch(e){ res('(응답 없음)'); }
    setTimeout(() => res('(응답 없음)'), 1500);
  });
}
// 서비스워커와 캐시를 모두 지우고 새로 받는다 (막힌 상태를 확실히 푸는 방법)
async function hardRefresh(manual){
  if(manual) toast('앱을 새로 받는 중…');
  try{
    const regs = await navigator.serviceWorker.getRegistrations();
    for(const r of regs) await r.unregister();
    for(const k of await caches.keys()) await caches.delete(k);
  }catch(e){}
  setTimeout(() => location.reload(), manual ? 600 : 0);
}
async function initServiceWorker(){
  if(!('serviceWorker' in navigator) || !location.protocol.startsWith('http')) return;
  try{
    const reg = await navigator.serviceWorker.register('sw.js');
    reg.update().catch(()=>{});
    const ver = await swVersion();
    // 오래된 서비스워커가 잡고 있으면 한 번만 자동 복구 (무한 새로고침 방지)
    if(ver && ver !== SW_EXPECTED && ver !== '(응답 없음)' && !sessionStorage.getItem('sw-fixed')){
      sessionStorage.setItem('sw-fixed', '1');
      await hardRefresh(false);
    }
  }catch(e){}
}
// 문제가 어디서 막히는지 단계별로 확인해 보여준다.
// CORS 방식과 no-cors 방식을 나눠 재 봄으로써
// "네트워크가 아예 막힘"과 "연결은 되는데 브라우저 규칙에 걸림"을 구분한다.
async function probe(label, url, noCors){
  const t0 = performance.now();
  try{
    const r = await fetch(url, noCors ? { cache:'no-store', mode:'no-cors' } : { cache:'no-store' });
    const ms = Math.round(performance.now() - t0);
    if(noCors) return label + ': 🟢 연결됨 (' + ms + 'ms)';
    return label + ': ' + (r.ok ? '🟢 정상 ' + r.status : '🟡 응답 ' + r.status) + ' (' + ms + 'ms)';
  }catch(e){
    return label + ': 🔴 실패 — ' + esc(e.message || e.name);
  }
}
async function runDiagnostics(){
  const out = document.getElementById('diag-out');
  out.innerHTML = '진단 중… (10초 정도 걸릴 수 있어요)';
  const L = [];
  L.push('인터넷: ' + (navigator.onLine ? '🟢 연결됨' : '🔴 끊김'));
  const ver = await swVersion();
  L.push('앱 버전: ' + (ver === null ? '(서비스워커 없음)' : esc(ver)) +
    (ver === SW_EXPECTED || ver === null ? ' 🟢' : ' 🔴 오래된 버전 → [앱 완전 새로고침]을 눌러주세요'));

  L.push(await probe('① 앱 서버', new URL('manifest.json?t=' + Date.now(), location.href).href)); // 하위 경로 배포(/link-archivist/)를 고려해 상대 경로로 계산
  L.push(await probe('② 일반 인터넷', 'https://www.google.com/favicon.ico?t=' + Date.now(), true));
  L.push(await probe('③ GitHub 사이트', 'https://github.com/favicon.ico?t=' + Date.now(), true));
  L.push(await probe('④ GitHub API(연결)', 'https://api.github.com/zen?t=' + Date.now(), true));
  L.push(await probe('⑤ GitHub API(실제)', 'https://api.github.com/zen'));

  if(settings.ghToken){
    try{ L.push('토큰 확인: 🟢 ' + esc(await ghLogin())); }
    catch(e){ L.push('토큰 확인: 🔴 ' + esc(e.message)); }
  }else{
    L.push('토큰: ⚪ 저장 안 됨');
  }
  out.innerHTML = L.join('<br>');
}

/* ============================================================
   자동 가져오기 — 다른 기기의 변경을 빨리 받아온다
   업로드는 변경 3초 뒤(scheduleSync), 내려받기는 아래 네 가지 순간에.
   ============================================================ */
let lastPullAt = 0;
function autoPull(){
  if(!settings.ghToken || syncing) return;
  if(Date.now() - lastPullAt < 8000) return;      // 너무 잦은 호출은 건너뛴다 (GitHub 사용량 절약)
  lastPullAt = Date.now();
  syncNow(false);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) autoPull(); }); // 앱으로 돌아올 때
window.addEventListener('focus', autoPull);                                              // 창을 다시 클릭할 때
window.addEventListener('online', ()=>{ setCloudIcon('☁️'); autoPull(); });              // 인터넷 복구될 때
setInterval(()=>{ if(!document.hidden && navigator.onLine) autoPull(); }, 45000);         // 보고 있는 동안 45초마다
initServiceWorker();
</script>
