  제작자의 동의 없는 재배포·수정·상업적 이용을 금합니다.

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<title>링크보관함 — DM 링크 자동 정리</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
/* ============================================================
   링크보관함 (Link Archivist)
   인스타그램 DM 텍스트를 붙여넣으면 링크를 추출하고
   AI(또는 키워드 규칙)로 폴더를 자동 분류해 로컬에 저장하는 앱.
   - 데이터 저장: localStorage (기기 내부, 서버 없음)
   - AI 분류: Gemini / Claude / OpenAI API (설정에서 키 입력)
   ============================================================ */
:root{
  --primary:#4F46E5;      /* 인디고 - 메인 색 */
  --primary-dark:#4338CA;
  --primary-light:#EEF2FF;
  --bg:#F4F5FA;
  --card:#FFFFFF;
  --text:#1E2235;
  --text-sub:#6B7280;
  --border:#E5E7EB;
  --danger:#EF4444;
  --success:#10B981;
  --radius:14px;
  --shadow:0 1px 3px rgba(30,34,53,.08), 0 4px 14px rgba(30,34,53,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  background:var(--bg);color:var(--text);
  max-width:560px;margin:0 auto;
  display:flex;flex-direction:column;
  overscroll-behavior-y:none;
}

/* ---------- 상단 헤더 ---------- */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 10px;
}
header h1{font-size:1.25rem;font-weight:800;color:var(--primary);letter-spacing:-.02em}
header h1 span{color:var(--text)}
.icon-btn{
  background:none;border:none;font-size:1.35rem;cursor:pointer;
  padding:6px;border-radius:50%;line-height:1;
}
.icon-btn:active{background:var(--primary-light)}

/* ---------- 화면(뷰) 공통 ---------- */
main{flex:1;overflow-y:auto;padding:4px 16px 90px}
.view{display:none}
.view.active{display:block}
.section-title{font-size:.85rem;font-weight:700;color:var(--text-sub);margin:14px 2px 8px}

/* ---------- 1. 입력 화면 ---------- */
#dm-input{
  width:100%;min-height:220px;resize:vertical;
  border:1.5px solid var(--border);border-radius:var(--radius);
  padding:14px;font-size:.95rem;line-height:1.5;font-family:inherit;
  background:var(--card);box-shadow:var(--shadow);
}
#dm-input:focus{outline:none;border-color:var(--primary)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:14px;margin-top:10px;
  border:none;border-radius:var(--radius);
  font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;
}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow)}
.btn-primary:active{background:var(--primary-dark)}
.btn-outline{background:var(--card);color:var(--primary);border:1.5px solid var(--primary)}
.btn-outline:active{background:var(--primary-light)}
.hint{font-size:.8rem;color:var(--text-sub);margin-top:10px;line-height:1.6;text-align:center}

/* AI 분석 중 로딩 오버레이 */
#loading{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(255,255,255,.85);
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
#loading.on{display:flex}
.spinner{
  width:44px;height:44px;border-radius:50%;
  border:4px solid var(--primary-light);border-top-color:var(--primary);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-weight:700;color:var(--primary)}

/* ---------- 2. 검토 화면 ---------- */
.card-wrap{position:relative;margin-bottom:12px;border-radius:var(--radius);overflow:hidden}
.card-del-bg{  /* 스와이프 시 뒤에 보이는 빨간 삭제 배경 */
  position:absolute;inset:0;background:var(--danger);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:flex-end;
  color:#fff;font-weight:700;padding-right:22px;font-size:.95rem;
}
.card{
  position:relative;background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px;
  transition:transform .18s ease;touch-action:pan-y;
}
.card-top{display:flex;align-items:flex-start;gap:8px}
.type-badge{
  flex-shrink:0;font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:20px;
  color:#fff;margin-top:2px;
}
.card-title{
  flex:1;border:none;background:none;font-size:.98rem;font-weight:700;
  font-family:inherit;color:var(--text);width:100%;padding:2px 0;
}
.card-title:focus{outline:none;border-bottom:1.5px dashed var(--primary)}
.card-x{
  flex-shrink:0;background:none;border:none;color:var(--text-sub);
  font-size:1.05rem;cursor:pointer;padding:2px 4px;
}
.card-url{
  font-size:.78rem;color:var(--primary);margin-top:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;
}
.card-memo{font-size:.82rem;color:var(--text-sub);margin-top:6px;line-height:1.45}
.chip-row{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;font-size:.78rem;font-weight:600;padding:6px 12px;
  border-radius:20px;border:1.5px solid var(--border);
  background:var(--card);color:var(--text-sub);cursor:pointer;font-family:inherit;
}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.empty{
  text-align:center;color:var(--text-sub);padding:60px 20px;line-height:1.8;font-size:.92rem;
}
.empty .big{font-size:2.4rem;display:block;margin-bottom:8px}

/* ---------- 3. 보관함 화면 ---------- */
#search{
  width:100%;padding:12px 16px;border:1.5px solid var(--border);
  border-radius:var(--radius);font-size:.95rem;font-family:inherit;
  background:var(--card);box-shadow:var(--shadow);
}
#search:focus{outline:none;border-color:var(--primary)}
#folder-filter{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:2px;scrollbar-width:none}
#folder-filter::-webkit-scrollbar{display:none}
.archive-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px;margin-bottom:10px;cursor:pointer;
}
.archive-head{display:flex;align-items:flex-start;gap:8px}
.archive-title{flex:1;font-size:.96rem;font-weight:700;line-height:1.4;word-break:break-all}
.archive-menu-btn{background:none;border:none;font-size:1.1rem;color:var(--text-sub);cursor:pointer;padding:0 4px}
.archive-meta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.folder-tag{font-size:.72rem;font-weight:700;color:var(--primary);background:var(--primary-light);padding:3px 9px;border-radius:20px}
.archive-date{font-size:.72rem;color:var(--text-sub)}
.archive-domain{font-size:.72rem;color:var(--text-sub)}

/* ---------- 모달(설정/폴더관리/항목메뉴) ---------- */
.modal-bg{
  position:fixed;inset:0;z-index:50;display:none;
  background:rgba(30,34,53,.45);align-items:flex-end;justify-content:center;
}
.modal-bg.on{display:flex}
.modal{
  background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:560px;
  max-height:86vh;overflow-y:auto;padding:20px 18px 30px;
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.modal h2{font-size:1.05rem;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal h2 button{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text-sub)}
.field{margin-bottom:14px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--text-sub);margin-bottom:6px}
.field input,.field select{
  width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;
  font-size:.92rem;font-family:inherit;background:var(--card);color:var(--text);
}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary)}
.folder-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
.folder-row span{flex:1;font-size:.92rem;font-weight:600}
.folder-row small{color:var(--text-sub);font-size:.75rem}
.mini-btn{
  background:var(--primary-light);border:none;border-radius:8px;padding:6px 10px;
  font-size:.78rem;font-weight:700;color:var(--primary);cursor:pointer;font-family:inherit;
}
.mini-btn.red{background:#FEE2E2;color:var(--danger)}
.menu-item{
  display:block;width:100%;text-align:left;background:none;border:none;
  padding:14px 6px;font-size:.98rem;font-weight:600;font-family:inherit;
  border-bottom:1px solid var(--border);cursor:pointer;color:var(--text);
}
.menu-item.red{color:var(--danger)}

/* ---------- 하단 탭 ---------- */
nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:560px;z-index:40;
  display:flex;background:var(--card);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;background:none;border:none;padding:9px 0 8px;cursor:pointer;
  font-family:inherit;font-size:.72rem;font-weight:700;color:var(--text-sub);
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;
}
nav button .ni{font-size:1.3rem}
nav button.on{color:var(--primary)}
.badge{
  position:absolute;top:4px;right:calc(50% - 24px);
  background:var(--danger);color:#fff;font-size:.62rem;font-weight:800;
  min-width:16px;height:16px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}

/* ---------- 토스트 ---------- */
#toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:#fff;font-size:.85rem;font-weight:600;
  padding:11px 20px;border-radius:24px;opacity:0;pointer-events:none;
  transition:all .25s ease;z-index:70;white-space:nowrap;max-width:90vw;
  overflow:hidden;text-overflow:ellipsis;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 4. 메모 화면 ---------- */
#memo-filter{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:2px;scrollbar-width:none}
#memo-filter::-webkit-scrollbar{display:none}
.memo-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px;margin-bottom:10px;cursor:pointer;
}
.memo-card-head{display:flex;align-items:flex-start;gap:8px}
.memo-card-title{flex:1;font-size:.96rem;font-weight:700;line-height:1.4;word-break:break-all}
.memo-card-body{font-size:.83rem;color:var(--text-sub);margin-top:6px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.memo-card-meta{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.tagpill{font-size:.71rem;font-weight:700;color:var(--primary);background:var(--primary-light);padding:3px 9px;border-radius:20px}
.tagpill.auto{color:var(--text-sub);background:#F1F2F6}
.tagpill.x{cursor:pointer}
.memo-stats{
  display:flex;gap:10px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:11px 14px;margin-bottom:10px;
}
.memo-stats div{flex:1;text-align:center;line-height:1.3}
.memo-stats b{display:block;font-size:1.05rem;color:var(--primary);font-variant-numeric:tabular-nums}
.memo-stats span{font-size:.68rem;color:var(--text-sub)}
.fab{
  position:fixed;right:calc(50% - 280px + 16px);bottom:80px;z-index:41;
  width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;
  background:var(--primary);color:#fff;font-size:1.6rem;line-height:1;
  box-shadow:0 4px 14px rgba(79,70,229,.45);
}
@media(max-width:592px){.fab{right:16px}}

/* ---------- 5. 메모 편집 화면 ---------- */
.edit-bar{display:flex;align-items:center;gap:6px;margin:6px 0 10px}
.edit-bar .grow{flex:1}
.icon-sm{background:none;border:none;font-size:1.15rem;cursor:pointer;padding:6px;border-radius:8px;color:var(--text-sub)}
.icon-sm.on{background:var(--primary-light)}
#memo-title{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius);
  font-size:1rem;font-weight:700;font-family:inherit;background:var(--card);box-shadow:var(--shadow);color:var(--text);
}
#memo-body{
  width:100%;min-height:240px;resize:vertical;margin-top:10px;
  border:1.5px solid var(--border);border-radius:var(--radius);
  padding:14px;font-size:.95rem;line-height:1.65;font-family:inherit;
  background:var(--card);box-shadow:var(--shadow);color:var(--text);
}
#memo-title:focus,#memo-body:focus{outline:none;border-color:var(--primary)}
.tag-input-row{display:flex;gap:8px;margin-top:10px}
.tag-input-row input{
  flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;
  font-size:.88rem;font-family:inherit;background:var(--card);color:var(--text);
}
.tag-input-row input:focus{outline:none;border-color:var(--primary)}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-top:12px}
.panel h3{font-size:.82rem;color:var(--text-sub);margin-bottom:8px}
.panel ul{margin:0;padding-left:18px}
.panel li{font-size:.88rem;line-height:1.6;margin-bottom:4px}
.todo-row{display:flex;align-items:flex-start;gap:9px;padding:7px 0}
.todo-row input{width:19px;height:19px;flex-shrink:0;margin-top:1px;accent-color:var(--primary)}
.todo-row label{flex:1;font-size:.9rem;line-height:1.45}
.todo-row.done label{text-decoration:line-through;color:var(--text-sub)}
.todo-row button{background:none;border:none;color:var(--text-sub);cursor:pointer;font-size:.95rem;padding:0 2px}
.save-mark{font-size:.72rem;color:var(--text-sub);white-space:nowrap}

/* ---------- 제작자 표시 버튼(공용 모듈) 자리 조정 ----------
   기본값은 오른쪽 위인데 헤더의 ⚙️ 설정 버튼과 겹쳐서
   설정 대신 정보 화면이 열리는 일이 있었다. 하단 탭 위 왼쪽으로 내린다.
   (오른쪽 아래는 메모 ✚ 버튼 자리) */
.otk-bar{
  top:auto !important; right:auto !important; left:12px !important;
  bottom:calc(66px + env(safe-area-inset-bottom)) !important;
  opacity:.4 !important;
}
.otk-bar:hover,.otk-bar.otk-lit{opacity:1 !important}
.otk-btn{width:34px !important;height:34px !important;font-size:15px !important}

.memo-card-head .archive-menu-btn{padding:2px 4px;margin:-2px -2px 0 2px;line-height:1}
#memo-empty-trash{margin-top:4px}
/* ---------- 메모 정렬/폴더 도구줄 ---------- */
.memo-toolbar{display:flex;gap:7px;align-items:center;margin:12px 0 2px}
.memo-toolbar select{
  flex:1;min-width:0;padding:9px 10px;border:1.5px solid var(--border);border-radius:10px;
  font-family:inherit;font-size:.85rem;background:var(--card);color:var(--text);
}
.memo-toolbar select:focus{outline:none;border-color:var(--primary)}
.memo-toolbar .mini-btn{white-space:nowrap;padding:9px 11px}
.memo-toolbar .mini-btn.off{background:#F1F2F6;color:var(--text-sub)}
.filter-label{font-size:.7rem;font-weight:700;color:var(--text-sub);margin:11px 2px 5px}
.chip.tag-on{background:#B45309;border-color:#B45309;color:#fff}
</style>
</head>
<body>

<header>
  <h1>🔗 링크<span>보관함</span></h1>
  <div>
    <button class="icon-btn" id="cloud-btn" onclick="syncNow(true)" title="지금 동기화" style="display:none">☁️</button>
    <button class="icon-btn" onclick="openSettings()" title="설정">⚙️</button>
  </div>
</header>

<main>
  <!-- ========== 1. 입력 화면 ========== -->
  <section id="view-input" class="view active">
    <p class="section-title">인스타그램 DM 텍스트를 붙여넣으세요</p>
    <textarea id="dm-input" placeholder="DM 대화 전체를 복사해서 여기에 붙여넣기 하세요.&#10;노션 링크, 구글 드라이브, 웹사이트 주소를 자동으로 찾아냅니다."></textarea>
    <button class="btn btn-outline" onclick="pasteClipboard()">📋 클립보드에서 붙여넣기</button>
    <button class="btn btn-primary" id="btn-extract" onclick="startExtract()">🔍 링크 추출 및 분류 시작</button>
    <p class="hint" id="input-hint">API 키를 설정하면 AI가 문맥을 읽고 제목·폴더를 자동으로 정해줍니다.<br>키가 없어도 키워드 규칙으로 기본 분류됩니다.</p>
  </section>

  <!-- ========== 2. 검토 화면 ========== -->
  <section id="view-review" class="view">
    <p class="section-title">저장 전에 제목과 폴더를 확인하세요 <span style="font-weight:400">(제목 터치 = 수정, 카드 왼쪽 스와이프 = 삭제)</span></p>
    <div id="review-list"></div>
    <button class="btn btn-primary" id="btn-save" onclick="saveAll()">💾 전체 저장</button>
  </section>

  <!-- ========== 3. 보관함 화면 ========== -->
  <section id="view-archive" class="view">
    <input id="search" type="search" placeholder="🔍 제목·메모·주소 검색" oninput="renderArchive()">
    <div id="folder-filter"></div>
    <div id="archive-list"></div>
    <button class="btn btn-outline" onclick="reclassifyArchive()">✨ AI로 제목·폴더 다시 정리</button>
    <button class="btn btn-outline" onclick="openFolderManager()">🗂️ 폴더 관리</button>
  </section>

  <!-- ========== 4. 메모 화면 ========== -->
  <section id="view-memo" class="view">
    <div class="memo-stats" id="memo-stats"></div>
    <input id="memo-search" type="search" placeholder="🔍 제목·본문·태그 검색" oninput="renderMemoList()">
    <div class="memo-toolbar">
      <select id="memo-sort" onchange="setMemoSort(this.value)">
        <option value="updated">최근 고친 순</option>
        <option value="created">새로 만든 순</option>
        <option value="created-asc">오래된 순</option>
        <option value="title">제목 가나다순</option>
        <option value="todo">할 일 많은 순</option>
      </select>
      <button class="mini-btn" id="memo-pintop-btn" onclick="toggleMemoPinTop()" title="고정한 메모를 맨 위로">📌 위로</button>
      <button class="mini-btn" onclick="openFolderManager()" title="폴더 관리">🗂️</button>
    </div>
    <div id="memo-filter"></div>
    <p class="filter-label">폴더</p>
    <div id="memo-folder-filter"></div>
    <button class="btn btn-outline" id="memo-empty-trash" onclick="emptyMemoTrash()" style="display:none">🗑️ 휴지통 비우기</button>
    <div id="memo-list"></div>
  </section>

  <!-- ========== 5. 메모 편집 화면 ========== -->
  <section id="view-memoedit" class="view">
    <div class="edit-bar">
      <button class="icon-sm" onclick="closeMemoEditor()" title="목록으로">←</button>
      <span class="save-mark" id="memo-savemark"></span>
      <span class="grow"></span>
      <button class="icon-sm" id="memo-pin-btn" onclick="toggleMemoFlag('pinned')" title="고정">📌</button>

<script>
/* ============================================================
   메모 엔진 (원클립 AI메모장에서 이식) — window.OneClip
   한국어 키워드 추출 · TextRank 요약 · 할 일 추출 · 검색/통계
   ============================================================ */
(function(global){
'use strict';

const STOPWORDS = new Set(['그리고','그래서','하지만','그러나','또한','또는','및','등','것','수','때','더','좀','바로','정말','매우','오늘','내일','어제','이번','저번','다음','우리','저희','제가','내가','너무','있다','없다','한다','했다','합니다','있습니다','없습니다','됩니다','입니다','대한','위한','통해','관련','경우','부분','내용','정도','이후','이전','현재','기존']);
const JOSA = ['은','는','이','가','을','를','에게','에서','으로','로','과','와','도','만','까지','부터','에','의','랑','이나','나','께서'];

function stripJosa(word){
  if(word.length < 2) return word;
  for(const j of JOSA.sort((a,b)=>b.length-a.length)){
    if(word.endsWith(j) && word.length - j.length >= 2) return word.slice(0, word.length - j.length);
  }
  return word;
}

/** 한국어 키워드 추출 → 자동 태그 */
function extractKeywords(text, topN = 4){
  if(!text) return [];
  const tokens = text.replace(/[^\uAC00-\uD7A3a-zA-Z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
  const freq = new Map();
  for(const t of tokens){
    const w = stripJosa(t);
    if(w.length < 2 || /^\d+$/.test(w) || STOPWORDS.has(w)) continue;
    freq.set(w, (freq.get(w)||0) + 1);
  }
  return [...freq.entries()]
    .filter(([,n]) => n >= 2)
    .sort((a,b) => b[1]-a[1] || b[0].length-a[0].length)
    .slice(0, topN)
    .map(([w]) => w);
}

function splitSentences(text){
  return text.split(/(?<=[.!?。])\s+|\n+/).map(s=>s.trim()).filter(s=>s.length >= 8);
}
function contentWords(sent){
  const out = new Set();
  for(const t of sent.replace(/[^\uAC00-\uD7A3a-zA-Z0-9\s]/g,' ').split(/\s+/)){
    const w = stripJosa(t);
    if(w.length >= 2 && !/^\d+$/.test(w) && !STOPWORDS.has(w)) out.add(w);
  }
  return out;
}

/** 정밀 추출 요약 — TextRank
 *  문장 간 어휘 중첩으로 유사도 그래프를 만들고 PageRank로 중심 문장을 뽑는다.
 *  빈도 기반보다 '글 전체를 대표하는 문장'을 안정적으로 선택한다. */
function summarize(text, maxSent = 3){
  if(!text || !text.trim()) return [];
  const sents = splitSentences(text);
  if(sents.length <= maxSent) return sents;

  const words = sents.map(contentWords);
  const n = sents.length;
  const sim = Array.from({length:n}, ()=>new Float64Array(n));
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    let ov = 0;
    for(const w of words[i]) if(words[j].has(w)) ov++;
    const denom = Math.log(words[i].size + 1) + Math.log(words[j].size + 1);
    const s = denom > 0 ? ov / denom : 0;
    sim[i][j] = s; sim[j][i] = s;
  }
  const outSum = sim.map(row => row.reduce((a,b)=>a+b, 0));
  let rank = new Float64Array(n).fill(1/n);
  const d = 0.85;
  for(let iter=0; iter<30; iter++){
    const next = new Float64Array(n).fill((1-d)/n);
    for(let i=0;i<n;i++) for(let j=0;j<n;j++){
      if(i!==j && outSum[j] > 0) next[i] += d * rank[j] * (sim[j][i] / outSum[j]);
    }
    rank = next;
  }
  return [...rank.keys()]
    .map(i=>({i, score: rank[i] + (i===0 ? 0.02 : 0)}))   // 첫 문장 미세 가중
    .sort((a,b)=>b.score-a.score).slice(0, maxSent)
    .sort((a,b)=>a.i-b.i).map(o=>sents[o.i]);
}

/** Claude API용 프롬프트 (JSON 강제) */
function buildClaudePrompt(text){
  return '다음 한국어 메모를 분석해 JSON으로만 답하세요. 마크다운 코드펜스나 다른 텍스트 없이 순수 JSON만 출력합니다.\n' +
    '형식: {"summary":["핵심 요약 문장 3~5개 (자연스러운 한국어로 재작성)"],"topics":["주요 주제 키워드 2~5개"],"todos":["실행할 일 항목 0~8개"]}\n' +
    '요약은 원문을 그대로 복사하지 말고 핵심을 압축해 다시 쓰세요.\n\n===메모===\n' + text.slice(0, 8000);
}

/** Claude 응답 파싱: 코드펜스 제거 후 JSON 검증 */
function parseClaudeJSON(raw){
  if(!raw) return null;
  try{
    const clean = raw.replace(/```json|```/g,'').trim();
    const d = JSON.parse(clean);
    return {
      summary: Array.isArray(d.summary) ? d.summary.filter(s=>typeof s==='string' && s.trim()).slice(0,6) : [],
      topics:  Array.isArray(d.topics)  ? d.topics.filter(s=>typeof s==='string' && s.trim()).slice(0,6)  : [],
      todos:   Array.isArray(d.todos)   ? d.todos.filter(s=>typeof s==='string' && s.trim()).slice(0,10)  : []
    };
  }catch(e){ return null; }
}

/** 할 일 추출: 목록 기호 or 행동 종결 패턴 */
function extractTodos(text){
  if(!text) return [];
  const out = [];
  const seen = new Set();
  for(const raw of text.split('\n')){
    const line = raw.trim();
    if(!line) continue;
    let item = null;
    const bullet = line.match(/^[-*•□☐]\s*(.+)$/);
    if(bullet) item = bullet[1].trim();
    else if(/(하기|해야\s*(함|한다|합니다)?|할\s*것|예정|까지\s*(제출|완료|마감))\s*[.!]?$/.test(line)) item = line.replace(/[.!]$/,'');
    if(item && item.length >= 2 && !seen.has(item)){ seen.add(item); out.push(item); }
  }
  return out;
}

/** 검색: 제목·본문·태그 대상, 공백 구분 AND */
function searchMemos(memos, query){
  const q = (query||'').trim().toLowerCase();
  if(!q) return memos;
  const terms = q.split(/\s+/);
  return memos.filter(m=>{
    const hay = (m.title+' '+m.body+' '+m.tags.join(' ')+' '+m.autoTags.join(' ')).toLowerCase();
    return terms.every(t=>hay.includes(t));
  });
}

/** 기록 자산 통계 */
function computeStats(memos){
  const live = memos.filter(m=>!m.deleted);
  const words = live.reduce((n,m)=> n + (m.title+' '+m.body).split(/\s+/).filter(Boolean).length, 0);
  const tags = new Set();
  live.forEach(m=>{ m.tags.forEach(t=>tags.add(t)); m.autoTags.forEach(t=>tags.add(t)); });
  const todosDone = live.reduce((n,m)=> n + m.todos.filter(t=>t.done).length, 0);
  return { memoCount: live.length, wordCount: words, tagCount: tags.size, todoDoneCount: todosDone };
}

function newMemo(){
  const now = Date.now();
  return { id:'m'+now+Math.random().toString(36).slice(2,7), title:'', body:'',
           tags:[], autoTags:[], todos:[], summary:[],
           pinned:false, archived:false, deleted:false, createdAt:now, updatedAt:now };
}

/** 뷰 필터 + 정렬 (고정 우선, 최신순) */
function filterMemos(memos, view, tag){
  let list;
  if(view === 'trash') list = memos.filter(m=>m.deleted);
  else if(view === 'archived') list = memos.filter(m=>!m.deleted && m.archived);
  else if(view === 'pinned') list = memos.filter(m=>!m.deleted && !m.archived && m.pinned);
  else if(view === 'tag') list = memos.filter(m=>!m.deleted && !m.archived && (m.tags.includes(tag)||m.autoTags.includes(tag)));
  else list = memos.filter(m=>!m.deleted && !m.archived);
  return list.sort((a,b)=> (b.pinned-a.pinned) || (b.updatedAt-a.updatedAt));
}

global.OneClip = { extractKeywords, summarize, extractTodos, searchMemos, computeStats, newMemo, filterMemos, stripJosa, buildClaudePrompt, parseClaudeJSON, splitSentences };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
/* ============================================================
   상태 및 저장소
   ============================================================ */
const LS = { items:'linkarchive-items', folders:'linkarchive-folders', settings:'linkarchive-settings', tombs:'linkarchive-tombs', memos:'linkarchive-memos' };

const DEFAULT_FOLDERS = ['작업치료','이스포츠 기획','영양제 정보','생활/주방용품','일반 참고자료'];
const DEFAULT_MODELS = { gemini:'gemini-2.5-flash', claude:'claude-haiku-4-5-20251001', openai:'gpt-4o-mini' };

let items    = load(LS.items, []);          // 저장된 링크 [{id,url,title,folder,memo,file,fileKind,createdAt,updatedAt}]
let folders  = load(LS.folders, DEFAULT_FOLDERS.slice());
let settings = load(LS.settings, { provider:'gemini', apiKey:'', model:'' });
let memos    = load(LS.memos, []);          // 메모 [{id,title,body,tags,autoTags,todos,summary,pinned,archived,deleted,createdAt,updatedAt}]
let tombs    = load(LS.tombs, { items:[], folders:[], memos:[] }); // 삭제 기록 — 동기화 시 다른 기기에도 삭제를 전파
let pending  = [];                          // 검토 대기 중인 링크
let currentFilter = '전체';
if(!Array.isArray(tombs.memos)) tombs.memos = [];   // 예전 버전에서 올라온 기록 보정

function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
function persistAll(){
  save(LS.items, items); save(LS.folders, folders); save(LS.tombs, tombs); save(LS.memos, memos);
  scheduleSync(); // 변경이 있으면 잠시 후 자동 동기화
}

/* ============================================================
   화면 전환 / 공통 UI
   ============================================================ */
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
  document.getElementById('view-'+name).classList.add('active');
  const tabBtn = document.getElementById('tab-'+name);
  if(tabBtn) tabBtn.classList.add('on');   // 메모 편집 화면처럼 탭이 없는 뷰도 있다
  if(name==='review') renderReview();
  if(name==='archive') renderArchive();
  if(name==='memo') renderMemoView();
  document.getElementById('memo-fab').style.display = (name==='memo') ? '' : 'none';
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('on'), 2200);
}
function closeModal(id){ document.getElementById(id).classList.remove('on'); }
function updateBadge(){
  const b = document.getElementById('review-badge');
  b.style.display = pending.length ? 'flex' : 'none';
  b.textContent = pending.length;
}
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// 모달 바깥(어두운 영역) 터치로 닫기
document.querySelectorAll('.modal-bg').forEach(m=>{
  m.addEventListener('click', e=>{ if(e.target===m) m.classList.remove('on'); });
});

/* ============================================================
   1. 링크 추출 (정규표현식)
   ============================================================ */
function extractLinks(text){
  const re = /https?:\/\/[^\s<>"'`)\]}]+/g;
  const matches = [];
  let m;
  while((m = re.exec(text))){
    // URL 끝에 붙은 문장부호 제거
    const url = m[0].replace(/[.,;:!?…]+$/, '');
    matches.push({ url, start: m.index, end: m.index + url.length });
  }
  const seen = new Set(); const out = [];
  for(let i = 0; i < matches.length; i++){
    const cur = matches[i];
    if(seen.has(cur.url)) continue;
    seen.add(cur.url);
    // 문맥은 "이전 링크 끝 ~ 다음 링크 시작" 사이로 제한한다.
    // (여러 링크가 붙어 있을 때 서로의 설명이 섞여 오분류되는 것을 방지)
    const prevEnd   = i > 0 ? matches[i-1].end : 0;
    const nextStart = i < matches.length-1 ? matches[i+1].start : text.length;
    const before = text.slice(Math.max(prevEnd, cur.start - 250), cur.start);
    const after  = text.slice(cur.end, Math.min(nextStart, cur.end + 120));
    const context = (before + ' ' + after).replace(/\s+/g, ' ').trim().slice(0, 300);
    out.push({ url: cur.url, context, before });
  }
  return out;
}

// 도메인으로 링크 종류 판별 (배지 표시용)
function linkType(url){
  let host = '';
  try{ host = new URL(url).hostname.replace(/^www\./,''); }catch(e){}
  if(/notion\.(so|site)/.test(host))            return {label:'노션',   color:'#111827'};
  if(/drive\.google/.test(host))                return {label:'드라이브', color:'#059669'};
  if(/docs\.google/.test(host))                 return {label:'구글문서', color:'#2563EB'};
  if(/youtu\.?be/.test(host))                   return {label:'유튜브',  color:'#DC2626'};
  if(/instagram/.test(host))                    return {label:'인스타',  color:'#C026D3'};
  if(/open\.kakao/.test(host))                  return {label:'오픈채팅', color:'#CA8A04'};
  if(/blog\.naver|tistory|brunch/.test(host))   return {label:'블로그',  color:'#16A34A'};
  return {label:'웹', color:'#6B7280'};
}
function domainOf(url){ try{ return new URL(url).hostname.replace(/^www\./,''); }catch(e){ return url; } }

/* ============================================================
   파일 링크 감지 및 자동 다운로드
   - 구글 드라이브 공유 링크 → 직접 다운로드 주소로 변환
   - 구글 문서/시트/슬라이드 → PDF/엑셀 내보내기 주소로 변환
   - .pdf .hwp .zip 등 확장자로 끝나는 직접 파일 링크 감지
   브라우저 보안상 파일은 앱 안이 아니라 기기의 '다운로드' 폴더에 저장된다.
   ============================================================ */
const FILE_EXTS = ['pdf','zip','hwp','hwpx','doc','docx','xls','xlsx','ppt','pptx','txt','csv','png','jpg','jpeg','gif','mp3','mp4','apk'];
function fileInfo(url){
  let u; try{ u = new URL(url); }catch(e){ return null; }
  const host = u.hostname.replace(/^www\./,'');
  if(host === 'drive.google.com'){
    const m = u.pathname.match(/\/file\/d\/([^/]+)/);
    const id = m ? m[1] : u.searchParams.get('id');
    if(id) return { direct:`https://drive.google.com/uc?export=download&id=${id}`, kind:'드라이브 파일' };
  }
  if(host === 'docs.google.com'){
    let m = u.pathname.match(/\/document\/d\/([^/]+)/);
    if(m) return { direct:`https://docs.google.com/document/d/${m[1]}/export?format=pdf`, kind:'구글문서 (PDF로 저장)' };
    m = u.pathname.match(/\/spreadsheets\/d\/([^/]+)/);
    if(m) return { direct:`https://docs.google.com/spreadsheets/d/${m[1]}/export?format=xlsx`, kind:'구글시트 (엑셀로 저장)' };
    m = u.pathname.match(/\/presentation\/d\/([^/]+)/);
    if(m) return { direct:`https://docs.google.com/presentation/d/${m[1]}/export/pdf`, kind:'슬라이드 (PDF로 저장)' };
  }
  const ext = (u.pathname.match(/\.([a-z0-9]{2,5})$/i) || [])[1];
  if(ext && FILE_EXTS.includes(ext.toLowerCase())) return { direct:url, kind:ext.toUpperCase()+' 파일' };
  return null;
}

// 숨은 iframe으로 다운로드 실행 (팝업 차단에 안 걸림)
// * 드라이브 대용량 파일은 바이러스 검사 안내 때문에 자동으로 안 될 수 있음 → 카드의 ⬇️ 버튼으로 수동 다운로드
function triggerDownload(directUrl){
  const f = document.createElement('iframe');
  f.style.display = 'none';
  f.src = directUrl;
  document.body.appendChild(f);
  setTimeout(()=>f.remove(), 60000); // 다운로드 시작 후 정리
}
function downloadItem(id){
  const it = items.find(x=>x.id===id) || pending.find(x=>x.id===id);
  if(it && it.file){ triggerDownload(it.file); toast('📥 다운로드 시작! 다운로드 폴더를 확인하세요'); }
}

/* ============================================================
   2. 분류 — 키워드 규칙 (API 키 없을 때의 기본 분류)
   ============================================================ */
const KEYWORD_RULES = [
  { folder:'작업치료',    words:['작업치료','감각통합','재활','치료','소아','아동발달','평가','임상','발달','언어치료','인지','시지각','OT','감각'] },
  { folder:'이스포츠 기획', words:['이스포츠','e스포츠','게임','대회','리그','토너먼트','스크림','롤','발로란트'] },
  { folder:'영양제 정보',  words:['영양제','비타민','오메가','유산균','프로바이오틱스','마그네슘','아연','건강기능식품','섭취'] },
  { folder:'생활/주방용품', words:['주방','살림','수납','정리','청소','생활용품','공구','템','추천템','꿀템','가전'] },
];
function classifyByKeyword(text){
  // 규칙마다 일치하는 키워드 수를 세서 가장 점수가 높은 폴더를 고른다
  let best = null, bestScore = 0;
  for(const rule of KEYWORD_RULES){
    if(!folders.includes(rule.folder)) continue; // 사용자가 지운 폴더는 제외
    const score = rule.words.reduce((n, w) => n + (text.includes(w) ? 1 : 0), 0);
    if(score > bestScore){ bestScore = score; best = rule.folder; }
  }
  if(best) return best;
  return folders.includes('일반 참고자료') ? '일반 참고자료' : (folders[0] || '일반 참고자료');
}
// 문맥에서 제목 후보 만들기 (AI가 없거나 실패했을 때)
// DM은 보통 "설명 문장 + 링크" 순서이므로, 링크 바로 앞의 마지막 문장을 제목으로 쓴다
function fallbackTitle(link){
  let hint = (link.before || '');
  // 마지막 줄 → 마지막 문장 순으로 좁혀가기 (이모지도 문장 구분자로 취급)
  const lines = hint.split('\n').map(s => s.trim()).filter(Boolean);
  if(lines.length) hint = lines[lines.length - 1];
  const sents = hint.split(/[.!?~…]+|[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}]/gu)
    .map(s => s.trim()).filter(s => s.length >= 4);
  if(sents.length) hint = sents[sents.length - 1];
  hint = hint.replace(/\s+/g, ' ').trim();
  if(hint.length >= 4) return hint.slice(0, 40);
  const ctx = link.context.replace(/\s+/g, ' ').trim();
  return ctx.length >= 4 ? ctx.slice(0, 40) : domainOf(link.url);
}

/* ============================================================
   3. 분류 — LLM API 호출 (Gemini / Claude / OpenAI)
   API 키는 설정 화면에서 입력하며 localStorage에만 저장된다.
   ============================================================ */
function buildPrompt(links){
  const list = links.map((l,i)=>`${i+1}. URL: ${l.url}\n   주변 문맥: ${l.context || '(없음)'}`).join('\n');
  return `당신은 링크 정리 도우미입니다. 아래는 인스타그램 DM에서 추출한 링크와 그 주변 문맥입니다.

각 링크에 대해 다음을 정해주세요.
1) title: 문맥을 참고한 한국어 제목 (40자 이내, 무엇에 대한 자료인지 알 수 있게)
2) folder: 반드시 다음 폴더 중 하나 → ${folders.join(', ')}
3) memo: 한 줄 요약 메모 (30자 이내, 없으면 빈 문자열)

링크 목록:
${list}

다른 설명 없이 아래 형식의 JSON 배열로만 답하세요:
[{"url":"...","title":"...","folder":"...","memo":"..."}]`;
}

/* Gemini 호출.
   모델 이름은 시간이 지나면 바뀔 수 있어서, 없는 모델이면
   사용 가능한 모델 목록을 받아 자동으로 골라 다시 시도한다. */
function geminiError(status, bodyText){
  let msg = '';
  try{ msg = (JSON.parse(bodyText).error || {}).message || ''; }catch(e){}
  if(status === 400 && /API key not valid/i.test(msg)) return 'API 키가 올바르지 않아요. 다시 확인해 주세요';
  if(status === 429) return '오늘 무료 사용량을 다 썼어요. 잠시 후 다시 시도해 주세요';
  if(status === 403) return 'API 키에 권한이 없어요 (키를 새로 만들어 보세요)';
  return 'Gemini 오류 ' + status + (msg ? ': ' + msg.slice(0, 120) : '');
}
// 이 키로 실제 쓸 수 있는 모델 목록을 가져온다 (모델 이름은 시간이 지나면 바뀐다)
// 이 키로 실제 쓸 수 있는 모델 목록을 가져온다 (API 버전이 다를 수 있어 v1beta → v1 순으로 시도)
async function geminiListModels(key){
  let last = { ok:false, models:[], error:'알 수 없음' };
  for(const ver of ['v1beta', 'v1']){
    let res;
    try{
      res = await fetch(`https://generativelanguage.googleapis.com/${ver}/models?pageSize=200`, {
        headers:{ 'x-goog-api-key': key }
      });
    }catch(e){ last = { ok:false, models:[], error:'네트워크 연결 실패' }; continue; }
    if(!res.ok){ last = { ok:false, models:[], error: geminiError(res.status, await res.text()) }; continue; }
    const data = await res.json();
    const models = (data.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => String(m.name).replace(/^models\//, ''))
      .filter(n => !/(embedding|aqa|image|tts|live|audio)/i.test(n));
    if(models.length) return { ok:true, models, error:'', ver };
    last = { ok:true, models:[], error:'', ver };
  }
  return last;
}
// Gemini 호출 과정을 그대로 기록해 둔다 (문제 원인을 눈으로 확인하기 위해)
let geminiLog = [];
async function geminiSend(ver, model, key, body){
  const url = `https://generativelanguage.googleapis.com/${ver}/models/${model}:generateContent`;
  let res;
  try{
    res = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json', 'x-goog-api-key': key }, body });
  }catch(e){
    geminiLog.push(`${ver}/${model} → 통신 실패`);
    throw new Error('Gemini 서버에 연결하지 못했어요');
  }
  if(!res.ok){
    const text = await res.clone().text();
    let m = ''; try{ m = (JSON.parse(text).error || {}).message || ''; }catch(e){}
    geminiLog.push(`${ver}/${model} → ${res.status} ${m.slice(0, 90)}`);
  }else{
    geminiLog.push(`${ver}/${model} → 200 성공`);
  }
  return res;
}
async function callGemini(model, key, prompt){
  geminiLog = [];
  const body = JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] });
  let res = await geminiSend('v1beta', model, key, body);
  if(res.status === 404) res = await geminiSend('v1', model, key, body);
  if(res.status === 404){
    const info = await geminiListModels(key);
    if(!info.ok){
      geminiLog.push('모델 목록 조회 실패: ' + info.error);
      throw new Error(`'${model}' 모델을 못 찾았고 목록 조회도 실패했어요 (${info.error})`);
    }
    geminiLog.push(`목록(${info.ver}): ` + (info.models.join(', ') || '(비어 있음)'));
    if(!info.models.length) throw new Error('이 API 키로 쓸 수 있는 모델이 하나도 없어요. 키를 새로 만들어 보세요');
    // 목록에 있는 모델을 순서대로 시도한다 (권장 모델부터)
    const tried = new Set([model]);
    const order = [pickBestModel(info.models)].concat(info.models).filter(n => n && !tried.has(n));
    for(const cand of order){
      if(tried.has(cand)) continue;
      tried.add(cand);
      res = await geminiSend(info.ver || 'v1beta', cand, key, body);
      if(res.ok){ settings.model = cand; save(LS.settings, settings); break; }
      if(res.status !== 404) break;   // 404가 아니면 모델 문제가 아니므로 중단
    }
    if(res.status === 404){
      throw new Error(`쓸 수 있다고 나온 모델(${info.models.length}개)이 모두 404예요. API 키의 사용 제한 설정을 확인해 주세요`);
    }
  }
  if(!res.ok) throw new Error(geminiError(res.status, await res.text()));
  const data = await res.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
}
// 설정 화면에서 모델을 눌러 고를 수 있게 보여준다
async function loadGeminiModels(append){
  const box = document.getElementById('model-list');
  if(document.getElementById('set-provider').value !== 'gemini'){
    box.innerHTML = '이 기능은 Gemini에서만 쓸 수 있어요'; return;
  }
  const key = document.getElementById('set-key').value.trim();
  if(!key){ toast('먼저 API 키를 입력하세요'); return; }
  const head = append ? box.innerHTML + '<br><br>' : '';
  box.innerHTML = head + '모델 목록 확인 중…';
  const info = await geminiListModels(key);
  if(!info.ok){ box.innerHTML = head + '🔴 모델 목록 조회 실패: ' + esc(info.error); return; }
  if(!info.models.length){ box.innerHTML = head + '🔴 이 키로 쓸 수 있는 모델이 없어요'; return; }
  const best = pickBestModel(info.models);
  box.innerHTML = head + '누르면 선택됩니다 (권장: 이름에 flash가 든 것)<br>' +
    info.models.map(n => '<button class="chip" style="margin:4px 4px 0 0"' +
      (n === best ? ' data-best="1"' : '') +
      ' onclick="pickModel(this.textContent)">' + esc(n) + '</button>').join('');
  if(best && !document.getElementById('set-model').value.trim()) pickModel(best, true);
}
// 진단 기록을 클립보드로 복사 (문제 상황을 그대로 전달하기 위해)
function copyGeminiLog(){
  const txt = [
    '앱 버전: ' + SW_EXPECTED,
    'AI 서비스: ' + document.getElementById('set-provider').value,
    '설정된 모델: ' + (document.getElementById('set-model').value.trim() || '(비움)'),
    '키 형식: ' + (document.getElementById('set-key').value.trim().slice(0,4) + '…' +
                   document.getElementById('set-key').value.trim().length + '자'),
    '',
    ...geminiLog
  ].join('\n');
  navigator.clipboard.writeText(txt)
    .then(() => toast('복사했어요! 붙여넣기 해서 알려주세요'))
    .catch(() => { prompt('아래 내용을 길게 눌러 복사하세요', txt); });
}
function pickModel(name, quiet){
  document.getElementById('set-model').value = name;
  if(!quiet) toast('모델 선택: ' + name);
}
// 빠르고 무료 사용량이 넉넉한 flash 계열을 우선 고른다
function pickBestModel(list){
  return list.find(n => /flash/i.test(n) && !/(thinking|preview|exp)/i.test(n))
      || list.find(n => /flash/i.test(n))
      || list.find(n => /pro/i.test(n) && !/(preview|exp)/i.test(n))
      || list[0] || null;
}
async function callLLM(prompt){
  const provider = settings.provider;
  const model = settings.model || DEFAULT_MODELS[provider];
  const key = settings.apiKey;

  if(provider === 'gemini') return callGemini(model, key, prompt);
  if(provider === 'claude'){
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'  // 브라우저에서 직접 호출 허용
      },
      body: JSON.stringify({ model, max_tokens: 4000, messages:[{ role:'user', content: prompt }] })
    });
    if(!res.ok) throw new Error(`Claude 오류 ${res.status}: ${(await res.text()).slice(0,200)}`);
    const data = await res.json();
    return data.content?.[0]?.text || '';
  }
  // openai
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key },
    body: JSON.stringify({ model, messages:[{ role:'user', content: prompt }] })
  });
  if(!res.ok) throw new Error(`OpenAI 오류 ${res.status}: ${(await res.text()).slice(0,200)}`);
  const data = await res.json();
  return data.choices?.[0]?.message?.content || '';
}

// LLM 응답에서 JSON 배열만 안전하게 꺼내기 (```json 코드펜스 등 제거)
function parseJsonArray(text){
  const start = text.indexOf('['), end = text.lastIndexOf(']');
  if(start === -1 || end === -1 || end <= start) throw new Error('JSON 배열을 찾지 못함');
  return JSON.parse(text.slice(start, end + 1));
}

/* ============================================================
   추출 → 분류 실행 (메인 버튼)
   ============================================================ */
async function startExtract(){
  const text = document.getElementById('dm-input').value.trim();
  if(!text){ toast('먼저 DM 텍스트를 붙여넣어 주세요'); return; }

  let links = extractLinks(text);
  if(links.length === 0){ toast('텍스트에서 링크를 찾지 못했어요'); return; }

  // 이미 보관함에 있거나 검토 대기 중인 링크는 건너뛰기 (같은 DM 중복 붙여넣기 방지)
  const known = new Set([...items.map(it=>it.url), ...pending.map(p=>p.url)]);
  const dupCount = links.filter(l=>known.has(l.url)).length;
  links = links.filter(l=>!known.has(l.url));
  if(links.length === 0){ toast(`링크 ${dupCount}개 모두 이미 저장되어 있어요`); return; }

  // 1차: 키워드 규칙으로 기본값 채우기 (AI 실패 시에도 결과가 나오도록)
  const now = Date.now();
  const newPending = links.map((l,i)=>{
    const fi = fileInfo(l.url); // 파일 링크면 직접 다운로드 주소 기억
    return {
      id: now + i,
      url: l.url,
      context: l.context,
      title: fallbackTitle(l),
      // DM은 "설명 → 링크" 순서라서, 링크 앞 텍스트가 충분하면 그것만으로 분류
      // (링크 뒤 텍스트는 대개 다음 링크의 설명이라 섞이면 오분류됨)
      folder: classifyByKeyword(l.before && l.before.trim().length >= 8 ? l.before : l.context),
      memo: '',
      file: fi ? fi.direct : '',
      fileKind: fi ? fi.kind : ''
    };
  });

  // 2차: API 키가 있으면 AI로 제목/폴더/메모 업그레이드
  if(settings.apiKey){
    const loading = document.getElementById('loading');
    document.getElementById('loading-text').textContent = `AI가 링크 ${links.length}개를 분석하고 있어요…`;
    loading.classList.add('on');
    try{
      const raw = await callLLM(buildPrompt(links));
      const parsed = parseJsonArray(raw);
      for(const p of newPending){
        const hit = parsed.find(x => x.url === p.url) || parsed[newPending.indexOf(p)];
        if(!hit) continue;
        if(hit.title)  p.title = String(hit.title).slice(0, 60);
        if(hit.memo)   p.memo  = String(hit.memo).slice(0, 60);
        if(hit.folder && folders.includes(hit.folder)) p.folder = hit.folder;
      }
      toast(`AI 분류 완료! 링크 ${links.length}개` + (dupCount ? ` (중복 ${dupCount}개 제외)` : ''));
    }catch(err){
      console.error(err);
      toast('AI 분석 실패 — 키워드 규칙으로 분류했어요');
    }finally{
      loading.classList.remove('on');
    }
  }else{
    toast(`링크 ${links.length}개 추출!` + (dupCount ? ` (중복 ${dupCount}개 제외)` : ''));
  }

  pending = pending.concat(newPending);
  document.getElementById('dm-input').value = '';
  updateBadge();
  showView('review');
}

function setPendingTitle(id, v){ const p = pending.find(x=>x.id===id); if(p) p.title = v.trim(); }
function setPendingFolder(id, chipEl){
  const p = pending.find(x=>x.id===id); if(!p) return;
  p.folder = chipEl.dataset.folder;
  chipEl.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));

// 터치 스와이프 삭제 처리
function attachSwipe(wrap){
  const card = wrap.querySelector('.card');
  let startX = 0, dx = 0, dragging = false;
  card.addEventListener('touchstart', e=>{
    startX = e.touches[0].clientX; dx = 0; dragging = true;
    card.style.transition = 'none';
  }, {passive:true});
  card.addEventListener('touchmove', e=>{
    if(!dragging) return;
    dx = e.touches[0].clientX - startX;
    if(dx < 0) card.style.transform = `translateX(${dx}px)`; // 왼쪽으로만
  }, {passive:true});
  card.addEventListener('touchend', ()=>{
    dragging = false;
    card.style.transition = 'transform .18s ease';
    if(dx < -100){ // 충분히 밀면 삭제
      card.style.transform = 'translateX(-110%)';
      setTimeout(()=>removePending(Number(wrap.dataset.id)), 160);
    }else{
      card.style.transform = 'none';
    }
  });
}

// 전체 저장 → 보관함으로 이동
function saveAll(){
  if(pending.length === 0) return;
  const now = new Date().toISOString();
  for(const p of pending){
    items.unshift({ id:p.id, url:p.url, title:p.title || domainOf(p.url), folder:p.folder, memo:p.memo,
                    file:p.file || '', fileKind:p.fileKind || '', createdAt: now, updatedAt: now });
  }
  // 파일 링크는 저장하면서 자동 다운로드 (설정에서 끌 수 있음)
  const files = pending.filter(p=>p.file);
  const n = pending.length;
  pending = [];
  persistAll(); updateBadge();
  if(files.length && settings.autoDownload !== false){
    files.forEach((p, i)=> setTimeout(()=>triggerDownload(p.file), i * 800)); // 순차 실행 (동시 다운로드 차단 방지)
    toast(`${n}개 저장 + 📥 파일 ${files.length}개 다운로드 시작!`);
  }else{
    toast(`${n}개 링크를 보관함에 저장했어요`);
  }
  showView('archive');
}

    const syncHint = (items.length === 0 && !settings.ghToken)
      ? '<br><br>다른 기기(폰)에 저장한 링크가 있나요?<br>설정 ⚙️ → <b>기기 간 동기화</b>에 폰과 <b>같은 GitHub 토큰</b>을 넣어야 여기에도 나타납니다.'
      : '';
    listEl.innerHTML = `<div class="empty"><span class="big">📚</span>${items.length===0?'아직 저장된 링크가 없어요.':'조건에 맞는 링크가 없어요.'}${syncHint}</div>`;

/* 이미 보관함에 저장된 링크의 제목·폴더를 AI로 다시 정리한다.
   DM 문맥이 남아 있지 않으므로 주소만 보고 추정한다(완벽하진 않다). */
async function reclassifyArchive(){
  if(!settings.apiKey){ toast('먼저 AI API 키를 입력하고 저장하세요'); return; }
  if(items.length === 0){ toast('보관함이 비어 있어요'); return; }
  if(!confirm(`보관함의 링크 ${items.length}개를 AI로 다시 정리할까요?\n제목과 폴더가 바뀔 수 있습니다.`)) return;

  const loading = document.getElementById('loading');
  const label = document.getElementById('loading-text');
  loading.classList.add('on');
  let done = 0, changed = 0;
  try{
    for(let i = 0; i < items.length; i += 20){
      const batch = items.slice(i, i + 20);
      label.textContent = `AI가 정리하는 중… (${done}/${items.length})`;
      const list = batch.map((it, n) => `${n+1}. URL: ${it.url}\n   현재 제목: ${it.title}`).join('\n');
      const prompt = `아래는 저장된 웹 링크 목록입니다. 주소(경로에 들어 있는 단어 포함)를 근거로 각 링크가 어떤 자료인지 추정해 주세요.

각 링크마다:
1) title: 한국어 제목 (40자 이내). 무엇에 대한 자료인지 알 수 있게. 추정이 어려우면 사이트 이름을 활용
2) folder: 반드시 다음 중 하나 → ${folders.join(', ')}
3) memo: 한 줄 메모 (30자 이내, 없으면 빈 문자열)

링크 목록:
${list}

다른 설명 없이 아래 형식의 JSON 배열로만 답하세요:
[{"url":"...","title":"...","folder":"...","memo":"..."}]`;
      const parsed = parseJsonArray(await callLLM(prompt));
      const ts = new Date().toISOString();
      for(const it of batch){
        const hit = parsed.find(x => x.url === it.url);
        if(!hit) continue;
        if(hit.title && String(hit.title).trim() && String(hit.title) !== it.title){
          it.title = String(hit.title).slice(0, 60); changed++;
        }
        if(hit.folder && folders.includes(hit.folder)) it.folder = hit.folder;
        if(hit.memo) it.memo = String(hit.memo).slice(0, 60);
        it.updatedAt = ts;
      }
      done += batch.length;
    }
    persistAll(); renderArchive();
    toast(`정리 완료 — 제목 ${changed}개를 다듬었어요`);
  }catch(err){
    console.error(err);
    toast('정리 실패: ' + String(err.message).slice(0, 60));
  }finally{
    loading.classList.remove('on');
  }
}
/* ============================================================
   4. 메모 (원클립 통합)
   - 저장 구조는 링크와 동일하게 localStorage + Gist 동기화를 탄다
   - 본문을 고칠 때마다 자동 태그·할 일이 다시 계산된다
   ============================================================ */
let memoView = 'all';        // all | pinned | archived | trash
let memoTag = null;          // 태그로 좁혀 보기 (카드의 #태그를 누르면 켜진다)
let memoFolder = '전체';     // 폴더 필터 — 링크와 같은 폴더 목록을 함께 쓴다 ('' = 미분류)
let curMemoId = null;
let memoSaveTimer = null;
let memoTypingAt = 0;        // 마지막 타자 시각 — 입력 중 자동 동기화가 덮어쓰지 않도록

function curMemo(){ return memos.find(m=>m.id===curMemoId) || null; }
function memoTitleOf(m){
  if((m.title||'').trim()) return m.title.trim();
  const first = (m.body||'').split('\n').find(l=>l.trim());
  return first ? first.trim().slice(0,40) : '(제목 없음)';
}
function memoDate(ts){
  const d = new Date(ts), now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})
    : d.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});
}

function renderMemoView(){ renderMemoStats(); renderMemoFilter(); renderMemoFolderFilter(); renderMemoList(); }

/* 정렬 방식은 이 기기에만 저장한다 (동기화하지 않음 — 기기마다 편한 정렬이 다르므로) */
function memoSort(){ return settings.memoSort || 'updated'; }
function memoPinTop(){ return settings.memoPinTop !== false; }
function setMemoSort(v){ settings.memoSort = v; save(LS.settings, settings); renderMemoList(); }
function toggleMemoPinTop(){
  settings.memoPinTop = !memoPinTop();
  save(LS.settings, settings);
  renderMemoToolbar(); renderMemoList();
  toast(memoPinTop() ? '📌 고정한 메모를 맨 위에 둡니다' : '고정 메모도 순서대로 섞어서 보여줍니다');
}
function renderMemoToolbar(){
  document.getElementById('memo-sort').value = memoSort();
  const b = document.getElementById('memo-pintop-btn');
  b.classList.toggle('off', !memoPinTop());
  b.textContent = memoPinTop() ? '📌 위로' : '📌 끔';
}
function sortMemos(list){
  const key = memoSort();
  const cmp = {
    updated:     (a,b)=> (b.updatedAt||0) - (a.updatedAt||0),
    created:     (a,b)=> (b.createdAt||0) - (a.createdAt||0),
    'created-asc':(a,b)=> (a.createdAt||0) - (b.createdAt||0),
    title:       (a,b)=> memoTitleOf(a).localeCompare(memoTitleOf(b), 'ko'),
    todo:        (a,b)=> b.todos.filter(t=>!t.done).length - a.todos.filter(t=>!t.done).length
                          || (b.updatedAt||0) - (a.updatedAt||0)
  }[key] || ((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
  return list.slice().sort((a,b)=> (memoPinTop() ? (b.pinned?1:0) - (a.pinned?1:0) : 0) || cmp(a,b));
}

function renderMemoStats(){
  const s = OneClip.computeStats(memos);
  document.getElementById('memo-stats').innerHTML =
    '<div><b>' + s.memoCount + '</b><span>메모</span></div>' +
    '<div><b>' + s.wordCount.toLocaleString() + '</b><span>단어</span></div>' +
    '<div><b>' + s.tagCount + '</b><span>태그</span></div>' +
    '<div><b>' + s.todoDoneCount + '</b><span>끝낸 할일</span></div>';
}

function renderMemoFilter(){
  const live = memos.filter(m=>!m.deleted && !m.archived);
  const base = [
    ['all', '전체 ' + live.length],
    ['pinned', '📌 고정 ' + live.filter(m=>m.pinned).length],
    ['archived', '📥 보관 ' + memos.filter(m=>!m.deleted && m.archived).length],
    ['trash', '🗑️ 휴지통 ' + memos.filter(m=>m.deleted).length]
  ];
  let html = base.map(b=>
    '<button class="chip ' + (memoView===b[0]?'on':'') + '" onclick="setMemoView(\'' + b[0] + '\')">' + esc(b[1]) + '</button>').join('');
  // 태그로 좁혀 본 상태면 해제 칩을 함께 보여준다
  if(memoTag) html += '<button class="chip tag-on" onclick="setMemoTag(null)">#' + esc(memoTag) + ' ✕</button>';

}
// 폴더 필터 — 링크와 같은 폴더 목록을 쓴다. 폴더가 없는 메모는 '미분류'
// 다른 기기에서 지워진 폴더를 가리키는 메모는 '미분류'로 취급한다 (어디에도 안 보이는 일이 없도록)
function memoFolderOf(m){ return folders.includes(m.folder) ? m.folder : ''; }

function renderMemoFolderFilter(){
  const pool = memosInView();
  const counts = {};
  let none = 0;
  pool.forEach(m=>{ const f = memoFolderOf(m); if(f) counts[f] = (counts[f]||0)+1; else none++; });
  let html = '<button class="chip ' + (memoFolder==='전체'?'on':'') + '" onclick="setMemoFolder(\'전체\')">전체 ' + pool.length + '</button>';
  html += folders.map(f=>
    '<button class="chip ' + (memoFolder===f?'on':'') + '" data-f="' + esc(f) + '" onclick="setMemoFolder(this.dataset.f)">' +
    esc(f) + ' ' + (counts[f]||0) + '</button>').join('');
  html += '<button class="chip ' + (memoFolder===''?'on':'') + '" onclick="setMemoFolder(\'\')">미분류 ' + none + '</button>';
  document.getElementById('memo-folder-filter').innerHTML = html;
}
function setMemoView(v){ memoView = v; renderMemoView(); }
function setMemoFolder(f){ memoFolder = f; renderMemoFolderFilter(); renderMemoList(); }
function setMemoTag(t){ memoTag = t || null; renderMemoView(); }

// 현재 보기(전체/고정/보관/휴지통)에 해당하는 메모 — 폴더 개수 세기에도 쓴다
function memosInView(){ return OneClip.filterMemos(memos, memoView, null); }

function renderMemoList(){
  const q = document.getElementById('memo-search').value;
  let list = memosInView();
  if(memoFolder !== '전체') list = list.filter(m => memoFolderOf(m) === memoFolder);
  if(memoTag) list = list.filter(m => m.tags.includes(memoTag) || m.autoTags.includes(memoTag));
  list = sortMemos(OneClip.searchMemos(list, q));

  const el = document.getElementById('memo-list');
  const emptyBtn = document.getElementById('memo-empty-trash');
  emptyBtn.style.display = (memoView === 'trash' && memos.some(m=>m.deleted)) ? '' : 'none';
  if(!list.length){
    const why = q ? '검색 결과가 없어요'
      : memoTag ? '이 태그의 메모가 없어요'
      : memoFolder !== '전체' ? '이 폴더에는 메모가 없어요'
      : '아직 메모가 없어요<br>오른쪽 아래 ✚ 를 눌러 시작하세요';
    el.innerHTML = '<div class="empty"><span class="big">📝</span>' + why + '</div>';
    return;
  }
  el.innerHTML = list.map(m=>{
    const tags = [...m.tags.map(t=>'<span class="tagpill x" data-t="' + esc(t) + '" onclick="event.stopPropagation();setMemoTag(this.dataset.t)">#' + esc(t) + '</span>'),
                  ...m.autoTags.filter(t=>!m.tags.includes(t)).map(t=>'<span class="tagpill auto x" data-t="' + esc(t) + '" onclick="event.stopPropagation();setMemoTag(this.dataset.t)">#' + esc(t) + '</span>')]
                  .slice(0,4).join('');
    const todoLeft = m.todos.filter(t=>!t.done).length;
    return '<div class="memo-card" onclick="openMemo(\'' + m.id + '\')">' +
      '<div class="memo-card-head">' +
        '<div class="memo-card-title">' + (m.pinned?'📌 ':'') + esc(memoTitleOf(m)) + '</div>' +
        '<span class="archive-date">' + memoDate(m.updatedAt) + '</span>' +
        '<button class="archive-menu-btn" data-id="' + m.id + '" onclick="event.stopPropagation();openMemoMenu(this.dataset.id)" title="메뉴">⋯</button>' +
      '</div>' +
      (m.body.trim() ? '<div class="memo-card-body">' + esc(m.body.trim()) + '</div>' : '') +
      '<div class="memo-card-meta">' +
        (memoFolderOf(m) ? '<span class="folder-tag">' + esc(memoFolderOf(m)) + '</span>' : '') + tags +
        (todoLeft ? '<span class="tagpill" style="background:#FEF3C7;color:#B45309">☑ 할일 ' + todoLeft + '</span>' : '') +
      '</div></div>';
  }).join('');
}
/* ---------- 편집 화면 ---------- */
function createMemo(){
  const m = OneClip.newMemo();
  m.folder = (memoFolder === '전체') ? '' : memoFolder;   // 보고 있던 폴더에 바로 담는다

}
function openMemo(id){
  curMemoId = id;
  showView('memoedit');

}
function closeMemoEditor(){
  saveMemoEdits();

  if(m && !m.title.trim() && !m.body.trim() && !m.tags.length){
    memos = memos.filter(x=>x.id!==m.id);
    persistAll();
  }

  showView('memo');
}
function renderMemoEditor(){

  document.getElementById('memo-body').value = m.body;

// 편집 화면의 폴더 선택 칩 (링크 검토 화면과 같은 모양)
function renderMemoFolderRow(){

function setMemoFolderOf(f){

function renderMemoTags(){

function renderMemoPanels(){

function onMemoInput(){

// 편집 내용을 메모 객체에 반영 (자동 태그·할 일 재계산 포함)
function saveMemoEdits(){
  clearTimeout(memoSaveTimer);
  const m = curMemo(); if(!m) return;
  if(!document.getElementById('view-memoedit').classList.contains('active')) return;
  const nt = document.getElementById('memo-title').value;
  const nb = document.getElementById('memo-body').value;
  if(nt === m.title && nb === m.body) return;
  m.title = nt; m.body = nb;
  m.autoTags = OneClip.extractKeywords(nt + '\n' + nb);
  const doneMap = new Map(m.todos.map(t=>[t.text, t.done]));
  m.todos = OneClip.extractTodos(nb).map(text=>({ text, done: doneMap.get(text) || false }));
  m.updatedAt = Date.now();
  persistAll();
  document.getElementById('memo-savemark').textContent = '저장됨 · ' + memoDate(m.updatedAt);
}
function touchMemo(m){ m.updatedAt = Date.now(); persistAll(); }
function toggleMemoFlag(flag){
  const m = curMemo(); if(!m) return;
  m[flag] = !m[flag];
  touchMemo(m); renderMemoEditor();
  toast(flag==='pinned' ? (m.pinned?'📌 고정했어요':'고정을 풀었어요')
                        : (m.archived?'📥 보관함으로 옮겼어요':'보관을 풀었어요'));
}
function toggleTodo(i, done){

  m.todos[i].done = done; touchMemo(m); renderMemoPanels();
}
function removeTodo(i){

}
function onTagKey(e){ if(e.key === 'Enter'){ e.preventDefault(); addMemoTag(); } }
function addMemoTag(){

function removeMemoTag(t){

}
function openMemoMenu(id){

function copyMemoText(){

function duplicateMemo(){
  const m = curMemo(); if(!m) return;
  const c = OneClip.newMemo();
  Object.assign(c, { title: memoTitleOf(m) + ' (사본)', body: m.body, folder: m.folder || '', tags:[...m.tags], autoTags:[...m.autoTags],
                     todos: m.todos.map(t=>({ text:t.text, done:t.done })), summary:[...(m.summary||[])] });
  memos.unshift(c); persistAll();
  closeModal('item-modal'); openMemo(c.id); toast('복제했어요');
}
function inMemoEditor(){ return document.getElementById('view-memoedit').classList.contains('active'); }
function trashMemo(){

  m.deleted = true; touchMemo(m);
  closeModal('item-modal'); curMemoId = null;
  showView('memo'); renderMemoView();

}
function restoreMemo(){

  m.deleted = false; touchMemo(m);
  closeModal('item-modal');

function purgeMemo(){

  if(!confirm('이 메모를 완전히 지울까요?\n동기화된 다른 기기에서도 사라집니다.')) return;

  persistAll();
  closeModal('item-modal'); curMemoId = null;

// 휴지통 비우기 — 안에 있는 메모를 모든 기기에서 지운다
function emptyMemoTrash(){
  const gone = memos.filter(m=>m.deleted);
  if(!gone.length){ toast('휴지통이 비어 있어요'); return; }
  if(!confirm('휴지통의 메모 ' + gone.length + '개를 완전히 지울까요?\n동기화된 다른 기기에서도 사라집니다.')) return;
  const at = Date.now();
  gone.forEach(m=>tombs.memos.push({ id: m.id, at }));   // 다른 기기에도 삭제 전파
  memos = memos.filter(m=>!m.deleted);
  persistAll(); renderMemoView();
  toast('휴지통을 비웠어요 (' + gone.length + '개)');
}

/* AI 요약(설정한 AI 서비스) 또는 기기 안에서 계산하는 TextRank 요약 */
async function analyzeMemo(useAI){
  saveMemoEdits();
  const m = curMemo(); if(!m) return;
  if(!m.body.trim()){ toast('먼저 내용을 입력해 주세요'); return; }

  if(!useAI){
    const s = OneClip.summarize(m.body, 3);
    if(!s.length){ toast('요약할 만큼 문장이 길지 않아요'); return; }
    m.summary = s;
    touchMemo(m); renderMemoPanels(); toast('⚡ 요약했어요 (기기 안에서 계산)');
    return;
  }
  if(!settings.apiKey){ toast('설정에서 AI API 키를 먼저 넣어주세요'); openSettings(); return; }
  const overlay = document.getElementById('loading');
  document.getElementById('loading-text').textContent = 'AI가 메모를 정리하고 있어요…';
  overlay.classList.add('on');
  try{
    const raw = await callLLM(OneClip.buildClaudePrompt(m.body));
    const r = OneClip.parseClaudeJSON(raw);
    if(!r) throw new Error('응답을 이해하지 못했어요');
    m.summary = r.summary;
    r.topics.forEach(t=>{ if(!m.tags.includes(t)) m.tags.push(t); });
    const doneMap = new Map(m.todos.map(t=>[t.text, t.done]));
    const merged = [...new Set([...r.todos, ...OneClip.extractTodos(m.body)])];
    m.todos = merged.map(text=>({ text, done: doneMap.get(text) || false }));
    touchMemo(m); renderMemoEditor();
    toast('✨ AI 정리 완료!');
  }catch(err){
    console.error(err);
    m.summary = OneClip.summarize(m.body, 3);   // 실패해도 빈손으로 돌려보내지 않는다
    touchMemo(m); renderMemoPanels();
    toast('AI 실패 — 기기 안 요약으로 대신했어요: ' + err.message);
  }finally{
    overlay.classList.remove('on');
  }
}

/* 메모 본문 속 링크를 검토 화면으로 넘긴다 (링크보관함 쪽과 연결) */
function memoLinksToArchive(){
  saveMemoEdits();
  const m = curMemo(); if(!m) return;
  const links = extractLinks(m.body);
  if(!links.length){ toast('메모 안에 주소가 없어요'); return; }
  const known = new Set(items.map(it=>it.url));
  const fresh = links.filter(l=>!known.has(l.url) && !pending.some(p=>p.url===l.url));
  if(!fresh.length){ toast('이미 보관함에 들어 있는 링크예요'); return; }
  const base = Date.now();   // 검토 화면은 숫자 id를 쓴다 (링크 추출과 같은 방식)
  fresh.forEach((l, i)=>{
    const info = fileInfo(l.url) || {};
    pending.push({ id: base + i, url: l.url, context: l.context,
                   title: fallbackTitle(l),
                   folder: classifyByKeyword((l.before && l.before.trim().length >= 8) ? l.before : l.context),
                   memo: '', file: info.direct || '', fileKind: info.kind || '' });
  });
  updateBadge();
  showView('review');
  toast('링크 ' + fresh.length + '개를 검토 화면으로 보냈어요');
}

/* ============================================================
   폴더 관리 (추가 / 이름변경 / 삭제)
   ============================================================ */
function openFolderManager(){
  renderFolderManager();
  document.getElementById('folder-modal').classList.add('on');
}
function renderFolderManager(){
  const counts = {}, mcounts = {};
  items.forEach(it=>counts[it.folder]=(counts[it.folder]||0)+1);
  memos.filter(m=>!m.deleted).forEach(m=>{ if(m.folder) mcounts[m.folder]=(mcounts[m.folder]||0)+1; });
  document.getElementById('folder-manage-list').innerHTML = folders.map((f,i)=>`
    <div class="folder-row">
      <span>${esc(f)} <small>(링크 ${counts[f]||0} · 메모 ${mcounts[f]||0})</small></span>
      <button class="mini-btn" onclick="renameFolder(${i})">이름변경</button>
      <button class="mini-btn red" onclick="deleteFolder(${i})">삭제</button>
    </div>`).join('');
}
function addFolder(){
  const input = document.getElementById('new-folder-name');
  const name = input.value.trim();
  if(!name){ toast('폴더 이름을 입력하세요'); return; }
  if(folders.includes(name)){ toast('이미 있는 폴더예요'); return; }
  folders.push(name);
  tombs.folders = tombs.folders.filter(t=>t.name!==name); // 다시 만든 폴더는 삭제 기록 취소
  persistAll();
  input.value = '';
  renderFolderManager(); renderArchive(); renderMemoView();
  toast(`'${name}' 폴더를 만들었어요`);
}
function renameFolder(i){
  const oldName = folders[i];
  const name = prompt('새 폴더 이름', oldName);
  if(!name || name.trim()===oldName) return;
  const newName = name.trim();
  if(folders.includes(newName)){ toast('이미 있는 폴더예요'); return; }
  folders[i] = newName;
  const ts = new Date().toISOString();
  items.forEach(it=>{ if(it.folder===oldName){ it.folder=newName; it.updatedAt=ts; } });
  memos.forEach(m=>{ if(m.folder===oldName){ m.folder=newName; m.updatedAt=Date.now(); } });
  pending.forEach(p=>{ if(p.folder===oldName) p.folder=newName; });
  if(memoFolder===oldName) memoFolder=newName;
  tombs.folders.push({ name: oldName, at: ts });               // 옛 이름은 다른 기기에서 제거
  tombs.folders = tombs.folders.filter(t=>t.name!==newName);    // 새 이름은 삭제 기록 취소
  if(currentFilter===oldName) currentFilter=newName;
  persistAll(); renderFolderManager(); renderArchive(); renderMemoView();
}
function deleteFolder(i){
  const name = folders[i];
  const count = items.filter(it=>it.folder===name).length;
  const mcount = memos.filter(m=>!m.deleted && m.folder===name).length;
  const detail = [
    count ? `링크 ${count}개는 '일반 참고자료'로 이동` : '',
    mcount ? `메모 ${mcount}개는 '미분류'로 이동` : ''
  ].filter(Boolean).join('\n');
  if(!confirm(`'${name}' 폴더를 삭제할까요?` + (detail ? '\n' + detail : ''))) return;
  folders.splice(i,1);
  const ts = new Date().toISOString();
  tombs.folders.push({ name, at: ts }); // 다른 기기에서도 이 폴더 제거
  if(count>0){
    if(!folders.includes('일반 참고자료')){ folders.push('일반 참고자료'); tombs.folders = tombs.folders.filter(t=>t.name!=='일반 참고자료'); }
    items.forEach(it=>{ if(it.folder===name){ it.folder='일반 참고자료'; it.updatedAt=ts; } });
  }
  memos.forEach(m=>{ if(m.folder===name){ m.folder=''; m.updatedAt=Date.now(); } });
  if(currentFilter===name) currentFilter='전체';
  if(memoFolder===name) memoFolder='전체';
  persistAll(); renderFolderManager(); renderArchive(); renderMemoView();
  toast('폴더를 삭제했어요');
}

function onProviderChange(){

}
function saveSettings(){
  const newToken = document.getElementById('set-ghtoken').value.trim();

    apiKey: document.getElementById('set-key').value.trim(),
    model: document.getElementById('set-model').value.trim(),
    autoDownload: document.getElementById('set-autodl').checked,
    ghToken: newToken,
    gistId: newToken === (settings.ghToken || '') ? (settings.gistId || '') : '' // 토큰이 바뀌면 저장소 다시 찾기
  };
  save(LS.settings, settings);
  closeModal('settings-modal');
  setCloudIcon('☁️');
  if(settings.ghToken){ toast('설정 저장! 동기화를 시작해요'); syncNow(false); }
  else toast(settings.apiKey ? 'AI 분류 설정 완료!' : '저장됨 (키 없음 → 키워드 분류)');
}
async function testApi(){
  // 저장 전 입력값으로 바로 테스트.
  // ★ 기존 설정을 통째로 바꾸면 안 된다 — 테스트 도중 저장이 일어나면
  //   GitHub 토큰 같은 다른 설정이 날아간다. 반드시 복사본에 덮어쓴다.
  const prev = settings;
  const form = {
    provider: document.getElementById('set-provider').value,
    apiKey: document.getElementById('set-key').value.trim(),
    model: document.getElementById('set-model').value.trim()
  };
  if(!form.apiKey){ toast('API 키를 먼저 입력하세요'); return; }
  settings = Object.assign({}, prev, form);
  toast('연결 확인 중…');
  let failed = false;
  try{
    const reply = await callLLM('"OK"라고만 답하세요.');
    toast(reply ? '✅ 연결 성공!' : '응답이 비어 있어요');
    document.getElementById('model-list').innerHTML =
      '🟢 사용 중인 모델: ' + esc(settings.model || DEFAULT_MODELS[settings.provider]);
  }catch(err){
    failed = true;
    toast('❌ ' + String(err.message).slice(0, 90));
    document.getElementById('model-list').innerHTML = '🔴 ' + esc(String(err.message)) +
      (geminiLog.length ? '<br><br><b>진행 기록</b><br>' + geminiLog.map(esc).join('<br>') +
        '<br><button class="mini-btn" style="margin-top:6px" onclick="copyGeminiLog()">📋 이 내용 복사</button>' : '');
  }finally{
    // 모델이 자동으로 대체됐다면 입력칸에 반영해 준다 (저장을 누르면 남는다)
    const found = settings.model;
    if(found && !form.model) document.getElementById('set-model').value = found;
    settings = prev;
    save(LS.settings, settings); // 테스트 중 덮어써졌을 수 있으니 원래 설정을 되돌려 놓는다
  }
  // 실패했으면 원인을 바로 알 수 있게 모델 목록까지 이어서 보여준다
  if(failed && form.provider === 'gemini') await loadGeminiModels(true);
}

// 백업 내보내기 / 가져오기
function exportData(){
  // 토큰까지 담으면 기기 초기화 후 한 번에 되살릴 수 있다 (대신 파일에 비밀 값이 들어감)
  const withKeys = confirm(

    '※ 넣을 경우 파일에 비밀 값이 들어가니 남에게 주지 마세요.');
  const payload = { items, folders, memos, tombs, savedAt: new Date().toISOString() };
  if(withKeys){
    payload.settings = {
      ghToken: settings.ghToken || '', gistId: settings.gistId || '',
      provider: settings.provider || 'gemini', model: settings.model || '', apiKey: settings.apiKey || ''
    };
  }
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const a = document.createElement('a');

  a.click();

  toast(withKeys ? '백업 저장 (토큰 포함)' : '백업 저장 (링크만)');
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data.items)) throw new Error('형식 오류');
      // 기존 데이터와 병합 (URL 중복은 건너뜀)
      const existing = new Set(items.map(it=>it.url));
      let added = 0;
      for(const it of data.items){ if(!existing.has(it.url)){ items.push(it); added++; } }
      for(const f of (data.folders||[])){ if(!folders.includes(f)) folders.push(f); }
      // 메모 병합 — 같은 id는 더 최근에 고친 쪽을 남긴다
      let addedMemo = 0;
      const byId = new Map(memos.map(m=>[m.id, m]));
      for(const raw of (data.memos||[])){
        const m = normalizeMemo(raw); if(!m) continue;
        const p = byId.get(m.id);
        if(!p){ byId.set(m.id, m); addedMemo++; }
        else if((m.updatedAt||0) > (p.updatedAt||0)) byId.set(m.id, m);
      }
      memos = [...byId.values()].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
      // 백업에 토큰이 들어 있으면 복구할지 물어본다
      let restored = false;
      if(data.settings && (data.settings.ghToken || data.settings.apiKey)){
        if(confirm('백업 파일에 토큰/키가 들어 있어요.\n이 기기에도 적용해서 동기화를 바로 켤까요?')){
          settings = Object.assign({}, settings, data.settings);
          save(LS.settings, settings);
          setCloudIcon('☁️');
          restored = true;
        }
      }
      persistAll(); renderArchive(); renderMemoView();
      toast(`가져오기 완료 (새 링크 ${added}개 · 새 메모 ${addedMemo}개)` + (restored ? ' · 토큰 복구됨' : ''));
      if(restored) syncNow(true);
    }catch(err){ toast('백업 파일을 읽지 못했어요'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}
/* 브라우저가 데이터를 지우지 않도록 '영구 저장'을 요청한다.
   시크릿 창이나 '종료 시 데이터 삭제' 설정에서는 허용되지 않는다. */
/* 앱 설치(PWA)
   브라우저가 설치 가능하다고 알려주면(beforeinstallprompt) 그 기회를 붙잡아 두었다가
   사용자가 버튼을 누를 때 설치 창을 띄운다. */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  renderInstallStatus();
});
window.addEventListener('appinstalled', () => {
  deferredInstall = null;
  toast('설치 완료! 이제 홈 화면/시작 메뉴에서 열 수 있어요');
  renderInstallStatus();
});
function isInstalled(){
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}
async function installApp(){
  if(isInstalled()){ toast('이미 앱으로 실행 중이에요'); return; }
  if(!deferredInstall){
    toast('브라우저 메뉴에서 "앱 설치"를 선택해 주세요');
    return;
  }
  deferredInstall.prompt();
  try{
    const { outcome } = await deferredInstall.userChoice;
    toast(outcome === 'accepted' ? '설치를 시작했어요' : '설치를 취소했어요');
  }catch(e){}
  deferredInstall = null;
  renderInstallStatus();
}
function renderInstallStatus(){
  const el = document.getElementById('install-status');
  const btn = document.getElementById('install-btn');
  if(!el || !btn) return;
  if(isInstalled()){
    el.innerHTML = '🟢 앱으로 실행 중입니다 (데이터가 안전하게 유지돼요)';
    btn.style.display = 'none';
  }else if(deferredInstall){
    el.innerHTML = '⚪ 아직 브라우저에서 열려 있어요. 설치하면 데이터가 더 안전하게 유지됩니다';
    btn.style.display = '';
  }else{
    el.innerHTML = '⚪ 브라우저 주소창의 설치 아이콘(⊕) 또는 메뉴 → "앱 설치"로 설치할 수 있어요';
    btn.style.display = '';
  }
}
let storagePersisted = null;
async function ensurePersistentStorage(){
  try{
    if(!navigator.storage || !navigator.storage.persist) return;
    storagePersisted = await navigator.storage.persisted();
    if(!storagePersisted) storagePersisted = await navigator.storage.persist();
  }catch(e){ storagePersisted = null; }
}
function renderStorageStatus(){
  const el = document.getElementById('storage-status');
  if(!el) return;
  if(storagePersisted === true){
    el.innerHTML = '🟢 이 기기에 데이터가 유지됩니다';
  }else if(storagePersisted === false){
    el.innerHTML = '🔴 <b>브라우저가 데이터를 지울 수 있는 상태예요.</b><br>' +
      '시크릿(비공개) 창이거나, 브라우저에 "종료할 때 인터넷 사용 기록 삭제"가 켜져 있으면 ' +
      '앱을 닫을 때마다 토큰과 링크가 사라집니다.<br>' +
      '→ 일반 창에서 열고, 브라우저 설정에서 이 사이트를 예외로 추가해 주세요.';
  }else{
    el.innerHTML = '⚪ 저장 상태를 확인할 수 없어요';
  }
}

/* ============================================================
   기기 간 동기화 (GitHub Gist)
   - 사용자의 GitHub 계정에 비공개 Gist 하나를 만들어 데이터 저장소로 쓴다
   - 폰·PC에 같은 토큰을 넣으면: 앱 열 때 자동 병합 + 변경 후 자동 업로드
   - 병합 규칙: 링크는 URL 기준으로 최신 수정본이 이김,
     삭제는 삭제 기록(tombs)이 항목보다 최신일 때만 반영
   ============================================================ */
const GIST_FILE = 'link-archivist-data.json';
let syncing = false, syncTimer = null;

function ghErrorText(status){
  if(status === 401) return '토큰이 유효하지 않아요 (만료됐거나 잘못 붙여넣음)';
  if(status === 403 || status === 404) return '토큰에 gist 권한이 없어요 (classic 토큰 필요)';
  return 'GitHub 오류 ' + status;
}
async function ghApi(path, opts = {}, token){
  let res;
  try{
    res = await fetch('https://api.github.com' + path, {
      ...opts,
      cache: 'no-store', // 브라우저가 응답을 60초 캐시해서 방금 만든 Gist가 안 보이는 문제 방지
      headers: {
        'Authorization': 'Bearer ' + (token || settings.ghToken),
        'Accept': 'application/vnd.github+json',
        ...(opts.body ? { 'Content-Type': 'application/json' } : {})
      }
    });
  }catch(e){
    // fetch 자체가 실패 = 통신 문제 (토큰 문제가 아님)
    const err = new Error(navigator.onLine
      ? 'GitHub에 연결하지 못했어요. 잠시 후 다시 시도하거나, 앱을 완전히 종료 후 다시 열어 주세요'
      : '오프라인이에요. 인터넷 연결을 확인해 주세요');
    err.network = true;
    throw err;
  }
  if(!res.ok){
    const err = new Error(ghErrorText(res.status));
    err.status = res.status;
    throw err;
  }
  if(res.status === 204) return null; // DELETE 성공 등 본문 없는 응답
  return res.json();
}
// 토큰이 진짜 내 계정 것인지 확인하고 계정 이름을 돌려준다.
// ★중요: /gists 는 토큰이 무효해도 200과 함께 '남들의 공개 gist 목록'을 돌려준다.
//   그래서 반드시 /user 로 신원을 먼저 확인해야 무효 토큰을 잡아낼 수 있다.
async function ghLogin(token){
  const u = await ghApi('/user', {}, token);
  if(!u || !u.login) throw new Error('계정 정보를 읽지 못했어요');
  return u.login;
}
// 내 계정이 소유한 동기화 Gist만 골라 최신순으로 반환 (남의 공개 gist는 절대 제외)
async function findMyGists(login){
  const list = await ghApi('/gists?per_page=100');
  return (Array.isArray(list) ? list : [])
    .filter(g => g.files && g.files[GIST_FILE] && g.owner && g.owner.login === login)
    .sort((a,b) => (b.updated_at||'').localeCompare(a.updated_at||''));
}
async function readGistData(id){
  const g = await ghApi('/gists/' + id);
  const f = g.files[GIST_FILE];
  if(!f) return null;
  const content = f.truncated ? await (await fetch(f.raw_url, { cache:'no-store' })).text() : f.content;
  try{ return JSON.parse(content); }catch(e){ return null; }
}

function newerOf(a, b){
  return ((a.updatedAt || a.createdAt || '') >= (b.updatedAt || b.createdAt || '')) ? a : b;
}
// 두 데이터 묶음 병합 (b쪽 폴더 순서 우선 — 로컬을 b로 넘긴다)
function mergeSets(a, b){
  const A = a || {}, B = b || {};
  const at = A.tombs || { items:[], folders:[], memos:[] }, bt = B.tombs || { items:[], folders:[], memos:[] };
  // 삭제 기록 병합 (URL/폴더명/메모 id별 최신 것만 유지)
  const tItem = new Map();
  [...(at.items||[]), ...(bt.items||[])].forEach(t => { const p = tItem.get(t.url); if(!p || t.at > p.at) tItem.set(t.url, t); });
  const tFold = new Map();
  [...(at.folders||[]), ...(bt.folders||[])].forEach(t => { const p = tFold.get(t.name); if(!p || t.at > p.at) tFold.set(t.name, t); });
  const tMemo = new Map();
  [...(at.memos||[]), ...(bt.memos||[])].forEach(t => { const p = tMemo.get(t.id); if(!p || t.at > p.at) tMemo.set(t.id, t); });
  // 링크 병합: URL별로 더 최근에 수정된 쪽이 이김
  const byUrl = new Map();
  [...(A.items||[]), ...(B.items||[])].forEach(it => { const p = byUrl.get(it.url); byUrl.set(it.url, p ? newerOf(it, p) : it); });
  // 삭제 기록이 항목 수정 시각보다 최신이면 항목 제거
  for(const [url, t] of tItem){
    const it = byUrl.get(url);
    if(it && (it.updatedAt || it.createdAt || '') <= t.at) byUrl.delete(url);
  }
  // 메모 병합: id별로 updatedAt(숫자)이 더 큰 쪽이 이김 — 링크와 같은 규칙
  const byId = new Map();
  [...(A.memos||[]), ...(B.memos||[])].forEach(m => {
    const mm = normalizeMemo(m); if(!mm) return;
    const p = byId.get(mm.id);
    byId.set(mm.id, (!p || (mm.updatedAt||0) >= (p.updatedAt||0)) ? mm : p);
  });
  for(const [id, t] of tMemo){
    const m = byId.get(id);
    if(m && (m.updatedAt || m.createdAt || 0) <= t.at) byId.delete(id);
  }
  // 폴더 병합: b 순서 우선 + a에만 있는 폴더 뒤에 추가, 삭제된 폴더 제외
  const fold = [...(B.folders||[])];
  (A.folders||[]).forEach(f => { if(!fold.includes(f)) fold.push(f); });
  const foldFinal = fold.filter(f => !tFold.has(f));
  return {
    items: [...byUrl.values()].sort((a2,b2) => (b2.createdAt||'').localeCompare(a2.createdAt||'')),
    folders: foldFinal.length ? foldFinal : DEFAULT_FOLDERS.slice(),
    memos: [...byId.values()].sort((a2,b2) => (b2.updatedAt||0) - (a2.updatedAt||0)),
    tombs: { items:[...tItem.values()].slice(-500), folders:[...tFold.values()].slice(-100), memos:[...tMemo.values()].slice(-300) }
  };
}
// 다른 기기(또는 예전 버전)에서 온 메모에 빠진 칸이 있어도 앱이 깨지지 않게 채워 준다
function normalizeMemo(m){
  if(!m || !m.id) return null;
  const t = Number(m.updatedAt) || Number(m.createdAt) || Date.now();
  return {
    id: String(m.id),
    title: String(m.title || ''),
    body: String(m.body || ''),
    folder: String(m.folder || ''),
    tags: Array.isArray(m.tags) ? m.tags.map(String) : [],
    autoTags: Array.isArray(m.autoTags) ? m.autoTags.map(String) : [],
    todos: Array.isArray(m.todos) ? m.todos.filter(x=>x && x.text).map(x=>({ text:String(x.text), done: !!x.done })) : [],
    summary: Array.isArray(m.summary) ? m.summary.map(String) : [],
    pinned: !!m.pinned, archived: !!m.archived, deleted: !!m.deleted,
    createdAt: Number(m.createdAt) || t,
    updatedAt: t
  };
}
// 원격 데이터와 현재 로컬 데이터 병합
function mergeData(remote){ return mergeSets(remote, { items, folders, memos, tombs }); }

async function syncNow(manual){
  if(!settings.ghToken || syncing) return;
  saveMemoEdits();                       // 쓰던 메모를 먼저 반영해야 병합에서 밀리지 않는다
  if(!manual && Date.now() - memoTypingAt < 4000){ scheduleSync(); return; }  // 타자 치는 중에는 미룬다
  if(!navigator.onLine){ setCloudIcon('⚠️'); if(manual) toast('오프라인이에요 — 인터넷 연결 후 다시 시도하세요'); return; }
  syncing = true; setCloudIcon('⏳');
  try{
    const login = await ghLogin();   // 신원 확인 먼저 — 무효한 토큰을 여기서 잡는다
    settings.ghLogin = login;

    let gistId = settings.gistId, remote = null, extras = [];
    if(gistId){
      // 저장해 둔 Gist가 지워졌으면(중복 정리 등) 다시 찾는다
      try{ remote = await readGistData(gistId); }
      catch(e){ if(e.status === 404) gistId = ''; else throw e; }
    }
    if(!gistId){
      const mine = await findMyGists(login);
      if(mine.length){
        gistId = mine[0].id;
        // 중복 저장소가 생겼다면 내용을 모두 합친 뒤, 업로드가 끝나고 정리한다
        for(const g of mine){
          const d = await readGistData(g.id);
          remote = remote ? mergeSets(d, remote) : d;
        }
        extras = mine.slice(1).map(g => g.id);
      }
    }
    const merged = mergeData(remote);
    items = merged.items; folders = merged.folders; tombs = merged.tombs; memos = merged.memos;
    // 로컬 저장 (persistAll을 쓰면 동기화가 또 예약되므로 직접 저장)
    save(LS.items, items); save(LS.folders, folders); save(LS.tombs, tombs); save(LS.memos, memos);
    // 병합 결과 업로드
    const payload = JSON.stringify({ items, folders, memos, tombs, updatedAt: new Date().toISOString() });
    if(gistId){
      await ghApi('/gists/' + gistId, { method:'PATCH', body: JSON.stringify({ files: { [GIST_FILE]: { content: payload } } }) });
    }else{
      const g = await ghApi('/gists', { method:'POST', body: JSON.stringify({
        description: '링크보관함 동기화 데이터 (자동 생성)', public: false,
        files: { [GIST_FILE]: { content: payload } }
      })});
      gistId = g.id;
    }
    // 업로드가 끝난 다음에 중복 정리 (중간에 실패해도 데이터는 이미 안전)
    for(const id of extras){ try{ await ghApi('/gists/' + id, { method:'DELETE' }); }catch(e){} }

    settings.gistId = gistId;
    settings.lastSync = new Date().toISOString();
    settings.syncError = '';
    save(LS.settings, settings);
    // 화면 갱신
    if(document.getElementById('view-archive').classList.contains('active')) renderArchive();
    if(document.getElementById('view-memo').classList.contains('active')) renderMemoView();
    if(document.getElementById('view-memoedit').classList.contains('active') && curMemo()) renderMemoEditor();
    setCloudIcon('☁️');
    if(manual) toast('☁️ 동기화 완료! 링크 ' + items.length + '개 · 메모 ' + memos.filter(m=>!m.deleted).length + '개');
  }catch(err){
    console.error(err);
    settings.syncError = err.message;
    save(LS.settings, settings);
    setCloudIcon('⚠️');
    toast('⚠️ 동기화 실패: ' + err.message); // 자동 동기화 실패도 반드시 알린다
  }finally{
    syncing = false;
    if(document.getElementById('settings-modal').classList.contains('on')) renderSyncStatus();
  }
}
// 변경 후 3초 뒤에 한 번만 업로드 (연속 수정을 묶어서 처리)
function scheduleSync(){
  if(!settings.ghToken) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>syncNow(false), 3000);
}
function setCloudIcon(ch){
  const b = document.getElementById('cloud-btn');
